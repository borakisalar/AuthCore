apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: borakisalar/authcore-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: authcore-config
          env:
            - name: EmailSettings__SenderEmail
              valueFrom:
                secretKeyRef:
                  name: authcore-secrets
                  key: EMAIL
            - name: EmailSettings__SenderPassword
              valueFrom:
                secretKeyRef:
                  name: authcore-secrets
                  key: EMAIL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
