version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: staj-sqlserver
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data
    networks:
      - staj-network

  redis:
    image: redis:latest
    container_name: staj-redis
    ports:
      - "6379:6379"
    networks:
      - staj-network

  api:
    image: borakisalar/staj-api:latest
    container_name: staj-api
    depends_on:
      - sqlserver
      - redis
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__UsersContext=Server=sqlserver,1433;Database=Users;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__AdventureWorksConnection=Server=sqlserver,1433;Database=AdventureWorks2022;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - Redis__Configuration=redis:6379
      - EmailSettings__SmtpServer=smtp.gmail.com
      - EmailSettings__SmtpPort=587
      - EmailSettings__SenderEmail=${EMAIL}
      - EmailSettings__SenderPassword=${EMAIL_PASSWORD}
    networks:
      - staj-network

networks:
  staj-network:
    driver: bridge
volumes:
  sqldata: